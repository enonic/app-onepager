kind: "Layout"
title: "1 column"
form:
  - type: "FormFragment"
    name: "menu-item"
  - type: "RadioButton"
    name: "color"
    label: "Background color"
    occurrences:
      min: 1
      max: 1
    options:
      - value: "bg-light"
        label: "Light"
      - value: "bg-dark"
        label: "Dark"
      - value: "bg-none"
        label: "None"
    default: "bg-light"
  - type: "CheckBox"
    name: "noPadding"
    label: "No padding top"
    occurrences:
      min: 0
      max: 1
  - type: "CheckBox"
    name: "fullWidth"
    label: "Full width"
    occurrences:
      min: 0
      max: 1
regions:
  - "center"
