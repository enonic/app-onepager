kind: "ContentType"
superType: "base:structured"
title: "Person"
form:
  - type: "FieldSet"
    label: "Person info"
    items:
      - type: "TextLine"
        name: "firstName"
        label: "First name"
        occurrences:
          min: 1
          max: 1
      - type: "TextLine"
        name: "middleName"
        label: "Middle name"
        occurrences:
          min: 0
          max: 1
      - type: "TextLine"
        name: "lastName"
        label: "Last name"
        occurrences:
          min: 1
          max: 1
      - type: "ImageSelector"
        name: "image"
        label: "Photo"
        occurrences:
          min: 1
          max: 1
        allowPath:
          - "${site}/*"
      - type: "TextLine"
        name: "jobTitle"
        label: "Job title"
        occurrences:
          min: 1
          max: 1
